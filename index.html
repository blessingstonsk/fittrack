<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17695A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2317695A'/%3E%3Cpath d='M5 10v4M8 7v10M16 7v10M19 10v4M8 12h8' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FitTrack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app (sticky header, bottom tab bar); widens to a two-column card grid with top tabs on desktop. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#14201C; --muted:#56675F; --line:#D3DDD8;
  --accent:#17695A; --accent-ink:#FFFFFF; --accent-soft:#D6EAE3;
  --plan:#A0640C; --forecast:#6A55B5; --target:#B8423A;
  --good:#1D7444; --warn:#8F5D00; --bad:#B3261E;
  --good-soft:#DCEFE2; --warn-soft:#F6EAD0; --bad-soft:#F6DDDA; --demo:#FCE9A8; --demo-ink:#4A3B00;
  --font-display:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px; --gutter-l:max(16px, env(safe-area-inset-left, 0px)); --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16201D; --surface-2:#1C2824; --ink:#E4EDE9; --muted:#9BAFA8; --line:#2B3A35;
  --accent:#52C2A7; --accent-ink:#04211A; --accent-soft:#173A31;
  --plan:#E2A548; --forecast:#A99AF2; --target:#F2857B;
  --good:#64CD8E; --warn:#E6B656; --bad:#F48C83;
  --good-soft:#163323; --warn-soft:#3A2D10; --bad-soft:#3D1A17; --demo:#4A3B00; --demo-ink:#FCE9A8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201D; --surface-2:#1C2824; --ink:#E4EDE9; --muted:#9BAFA8; --line:#2B3A35;
  --accent:#52C2A7; --accent-ink:#04211A; --accent-soft:#173A31;
  --plan:#E2A548; --forecast:#A99AF2; --target:#F2857B;
  --good:#64CD8E; --warn:#E6B656; --bad:#F48C83;
  --good-soft:#163323; --warn-soft:#3A2D10; --bad-soft:#3D1A17; --demo:#4A3B00; --demo-ink:#FCE9A8; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.78rem}
.label{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header + nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);max-width:1100px;margin:0 auto}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.45rem;letter-spacing:.01em}
.brand span{color:var(--accent)}
.sync{flex:1;min-width:0;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync.cloud b,.sync.sheets b{background:var(--good)} .sync.local b{background:var(--plan)} .sync.err b,.sync.memory b{background:var(--bad)} .sync.demo b{background:var(--plan)}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;min-width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;gap:6px}
.iconbtn svg{width:20px;height:20px}
.tabs{display:flex;gap:4px;max-width:1100px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 9px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:3px solid transparent}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.navtop{display:none}
.navbottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbottom .tabs button{border-bottom:0;border-top:3px solid transparent}
.navbottom .tabs button[aria-current="page"]{border-top-color:var(--accent)}
@media (min-width:860px){ .navtop{display:block} .navbottom{display:none} .tabs button{flex-direction:row;justify-content:center;font-size:.92rem;gap:8px} }

.demo-band{background:var(--demo);color:var(--demo-ink);font-weight:700;font-size:.85rem}
.demo-band .in{max-width:1100px;margin:0 auto;padding-block:8px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-band button{margin-left:auto}

main{max-width:1100px;margin:0 auto;padding-block:16px 110px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
@media (min-width:860px){ main{padding-bottom:48px} }
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:860px){ .grid.two{grid-template-columns:1fr 1fr} .span2{grid-column:1/-1} }
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card.flat{background:var(--surface-2)}
.card h2+*,.card h3+*{margin-top:10px}
.viewhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.viewhead h1{font-size:1.75rem}

/* big numbers */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){ .kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))} }
.kpi .v{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:1.9rem;font-weight:600;line-height:1.05}
.kpi .v small{font-size:.95rem;color:var(--muted);font-weight:500;margin-left:2px}
.kpi .s{font-size:.8rem;color:var(--muted)}
.bar{height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px 0 0 6px}
.bar.over i{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.plan{color:var(--plan)} .pill.fc{color:var(--forecast)}
.note{border-radius:10px;padding:10px 12px;font-size:.88rem;background:var(--surface-2);border:1px solid var(--line)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.note.bad{background:var(--bad-soft);border-color:transparent}
.note.good{background:var(--good-soft);border-color:transparent}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick .btn{flex-direction:column;min-height:72px;font-size:.9rem}
.quick .btn svg{width:24px;height:24px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 12px;min-height:40px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.82rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;min-height:44px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.datenav{display:flex;align-items:center;gap:6px}
.datenav input{max-width:160px}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .main .t{font-weight:700;overflow-wrap:anywhere}
.li .end{text-align:right;white-space:nowrap}
.meal h3{display:flex;align-items:center;gap:8px}
.meal h3 .num{margin-left:auto;font-size:1rem;color:var(--muted)}

/* charts */
.chartbox{position:relative;height:280px;width:100%}
.chartbox.sm{height:200px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:3px solid currentColor;display:inline-block}
.sw.dot{width:9px;height:9px;border:0;border-radius:50%;background:currentColor}
.sw.dash{border-top-style:dashed} .sw.dotted{border-top-style:dotted}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n{text-align:right;font-variant-numeric:tabular-nums}

/* sets */
.ex{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) auto;gap:6px 8px;align-items:center;margin-top:8px}
.sets .h{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.sets input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px;min-height:40px;width:100%;min-width:0;text-align:center}
.pr{color:var(--good);font-weight:700;font-size:.75rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:18px;padding:22px} }
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.9rem;max-width:calc(100% - 32px)}
@media (min-width:860px){ .toast{bottom:28px} }
.foodpick{display:flex;flex-direction:column;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.foodpick button{border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.foodpick button:first-child{border-top:0}
.foodpick button .main{flex:1;min-width:0}
.prose p+p{margin-top:8px}
.prose{max-width:68ch}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand">Fit<span>Track</span></div>
      <div class="sync" id="sync" role="status"><b></b>Loading…</div>
      <button class="iconbtn" data-act="tab" data-tab="settings" aria-label="Profile and settings" title="Profile and settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </button>
    </div>
    <nav class="navtop" aria-label="Sections"><div class="tabs" id="tabs-top"></div></nav>
  </header>
  <div id="demoband"></div>
  <main id="view"></main>
  <nav class="navbottom" aria-label="Sections"><div class="tabs" id="tabs-bottom"></div></nav>
</div>
<div id="sheetroot"></div>
<div id="toastroot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";
/* ============ utilities (all dates are IST calendar days, stored as YYYY-MM-DD) ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IST_MS = 5.5 * 3600e3;
const todayKey = () => new Date(Date.now() + IST_MS).toISOString().slice(0, 10);
const nowTimeIST = () => new Date(Date.now() + IST_MS).toISOString().slice(11, 16);
const dayNum = k => Math.round(Date.parse(k + "T00:00:00Z") / 864e5);
const keyFromNum = n => new Date(n * 864e5).toISOString().slice(0, 10);
const addDays = (k, n) => keyFromNum(dayNum(k) + n);
const dow = k => new Date(k + "T00:00:00Z").getUTCDay();
const DOW_KEYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const DOW_NAMES = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
const WEEK_ORDER = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const weekStart = k => addDays(k, -((dow(k) + 6) % 7));
const fmtDate = (k, o = {}) => k ? new Date(k + "T00:00:00Z").toLocaleDateString("en-IN", { timeZone: "UTC", day: "numeric", month: "short", ...o }) : "—";
const fmtDay = k => fmtDate(k, { weekday: "short" });
const isDateKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k || "") && !isNaN(Date.parse(k));
const r1 = x => Math.round(x * 10) / 10;
const fmtKg = x => x == null || !isFinite(x) ? "—" : r1(x).toFixed(1);
const fmtInt = x => x == null || !isFinite(x) ? "—" : Math.round(x).toLocaleString("en-IN");
const signed = (x, d = 1) => x == null || !isFinite(x) ? "—" : (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(x).toFixed(d);
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const num = v => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(x) ? x : null; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const clone = o => JSON.parse(JSON.stringify(o));

/* ============ reference data ============ */
const MEALS = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snacks: "Snacks" };
const ACTIVITY = {
  sedentary: { label: "Sedentary (desk job, little walking)", m: 1.2 },
  light: { label: "Lightly active (walks, 1–3 workouts/week)", m: 1.375 },
  moderate: { label: "Moderately active (3–5 workouts/week)", m: 1.55 },
  very: { label: "Very active (hard training 6–7 days/week)", m: 1.725 },
};
const GEN = "Generic estimate based on typical published values (e.g. IFCT 2017, USDA FoodData Central). Recipes and brands vary.";
const f = (id, name, state, kcal, p, c, fat, portions, note) => ({ id, name, state, per: { kcal, p, c, f: fat }, portions, src: GEN, note: note || "", builtin: true });
const BUILTIN_FOODS = [
  f("b-idli", "Idli", "cooked", 140, 4.5, 29, 0.6, [{ label: "piece (≈40 g)", g: 40 }]),
  f("b-dosa", "Plain dosa", "cooked", 168, 3.9, 29, 3.7, [{ label: "medium dosa (≈80 g)", g: 80 }], "Oil used on the tawa changes this a lot."),
  f("b-masala-dosa", "Masala dosa", "cooked", 170, 3.5, 25, 6.5, [{ label: "dosa with filling (≈180 g)", g: 180 }]),
  f("b-rice-cooked", "White rice", "cooked", 130, 2.7, 28, 0.3, [{ label: "cup (≈160 g)", g: 160 }, { label: "katori (≈120 g)", g: 120 }, { label: "tbsp (≈15 g)", g: 15 }]),
  f("b-rice-raw", "White rice, uncooked", "raw", 360, 6.8, 79, 0.6, [{ label: "cup uncooked (≈185 g)", g: 185 }, { label: "tbsp uncooked (≈12 g)", g: 12 }], "Weighed before cooking. 1 part raw ≈ 2.5–3 parts cooked."),
  f("b-sambar", "Sambar", "cooked", 60, 3, 8, 2, [{ label: "katori (≈150 g)", g: 150 }, { label: "ladle (≈75 g)", g: 75 }]),
  f("b-coconut-chutney", "Coconut chutney", "prepared", 230, 2.5, 9, 21, [{ label: "tbsp (≈15 g)", g: 15 }]),
  f("b-chapati", "Chapati / roti, no ghee", "cooked", 280, 9, 52, 4, [{ label: "medium roti (≈40 g)", g: 40 }]),
  f("b-dal", "Toor dal with tadka", "cooked", 120, 6.5, 17, 3, [{ label: "katori (≈150 g)", g: 150 }]),
  f("b-upma", "Upma", "cooked", 150, 3.5, 22, 5.5, [{ label: "katori (≈150 g)", g: 150 }, { label: "plate (≈200 g)", g: 200 }]),
  f("b-poha", "Poha", "cooked", 130, 2.5, 23, 3, [{ label: "plate (≈200 g)", g: 200 }]),
  f("b-chicken-cooked", "Chicken breast, skinless", "cooked", 165, 31, 0, 3.6, [{ label: "palm-size piece (≈100 g)", g: 100 }]),
  f("b-chicken-raw", "Chicken breast, skinless, raw", "raw", 120, 22.5, 0, 2.6, [], "Weighed raw. Cooking loses water, so 100 g raw ≈ 70–75 g cooked."),
  f("b-chicken-curry", "Chicken curry, home-style", "cooked", 150, 14, 4, 9, [{ label: "katori (≈150 g)", g: 150 }], "Oil and gravy vary."),

/* ============ weekly summary ============ */
function weekSummary(ws) {
  const today = todayKey();
  const days = []; for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d <= today) days.push(d); }
  const we = addDays(ws, 6);
  const daily = dailyWeights();
  const inWeek = daily.filter(p => p.date >= ws && p.date <= we);
  const prevWeek = daily.filter(p => p.date >= addDays(ws, -7) && p.date < ws);
  const P = state.profile;
  const logged = days.filter(d => (state.food[d] || []).length);
  const complete = logged.filter(d => (state.dayMeta[d] || {}).complete);
  const basis = complete.length >= 2 ? complete : logged;
  const kcalAvg = basis.length ? mean(basis.map(d => dayTotals(d).kcal)) : null;
  const protAvg = basis.length ? mean(basis.map(d => dayTotals(d).p)) : null;
  const mealAvg = {}; for (const m in MEALS) { const v = basis.map(d => dayTotals(d).byMeal[m] || 0); mealAvg[m] = v.length ? mean(v) : null; }
  const planned = days.filter(d => !plannedFor(d).rest);
  const st = { done: 0, partial: 0, skipped: 0, none: 0 };
  for (const d of planned) { const s = (state.workouts[d] || {}).status; if (s === "done") st.done++; else if (s === "partial") st.partial++; else if (s === "skipped") st.skipped++; else st.none++; }
  const extra = days.filter(d => plannedFor(d).rest && ["done", "partial"].includes((state.workouts[d] || {}).status)).length;
  return {
    ws, we, days, inWeek, prevWeek,
    avgW: inWeek.length ? mean(inWeek.map(p => p.kg)) : null, avgPrev: prevWeek.length ? mean(prevWeek.map(p => p.kg)) : null,
    logged, complete, basisIsComplete: basis === complete && complete.length >= 2, kcalAvg, protAvg, mealAvg,
    planned, st, extra, target: num(P.calorieTarget), protTarget: num(P.proteinTarget),
  };
}
function weekActions(S, plateau, arrival) {
  const acts = [];
  const elapsed = S.days.length;
  if (S.inWeek.length < Math.min(3, elapsed)) acts.push({ k: "weigh", t: "Weigh in on 3–4 mornings next week under the same conditions (after waking and using the toilet, before eating). This makes the trend reliable enough to read." });
  if (elapsed >= 4 && S.logged.length < Math.min(5, elapsed)) acts.push({ k: "log", t: `Food was logged on ${S.logged.length} of ${elapsed} days. Aim for at least 5 days next week. Saving your usual breakfast as a reusable meal makes this a one-tap entry.` });
  if (S.kcalAvg != null && S.target && S.kcalAvg > S.target * 1.05) {
    const top = Object.entries(S.mealAvg).filter(([, v]) => v != null).sort((a, b) => b[1] - a[1])[0];
    acts.push({ k: "kcal", t: `Average logged intake was about ${fmtInt(S.kcalAvg - S.target)} kcal above your ${fmtInt(S.target)} kcal target. ${top ? `${MEALS[top[0]]} was your largest meal (≈${fmtInt(top[1])} kcal on average); planning that meal ahead is a practical place to start.` : ""}` });
  }
  if (S.protAvg != null && S.protTarget && S.protAvg < S.protTarget * 0.85) acts.push({ k: "prot", t: `Protein averaged ${fmtInt(S.protAvg)} g against a ${fmtInt(S.protTarget)} g target. Add one protein source to another meal, such as eggs, chicken, dal, curd, paneer or a whey scoop.` });
  if (S.planned.length >= 2 && S.st.done + S.st.partial < S.planned.length * 0.6) acts.push({ k: "gym", t: `You completed ${S.st.done + S.st.partial} of ${S.planned.length} planned sessions. Next week, pick the sessions you're most likely to do and use Reschedule instead of skipping when a day falls through.` });
  if (plateau && plateau.known && plateau.flat && acts.length < 2) {
    const e = energyEstimate();
    acts.push({ k: "plat", t: `Weight has been roughly level for about 3 weeks. If that continues for another 1–2 weeks with consistent logging, consider lowering your calorie target by 100–200 kcal${e ? ` (staying at or above ${fmtInt(e.floor)} kcal)` : ""}, or adding about 2,000 steps a day. Check portion estimates first, since under-logging is common.` });
  }
  if (!acts.length) acts.push({ k: "keep", t: "Keep the same routine next week: your logging and training were consistent. Small, repeatable habits matter more than any single day." });
  return acts.slice(0, 2);
}

    if (rnd() < 0.6) s.dayMeta[d] = { complete: true };

  const kg = num($("#ob-weight")?.value);
  const e = energyEstimate(P, kg);
  let h = e ? `Suggested starting target: <b>${fmtInt(e.suggested)} kcal/day</b>. This is an estimate: your estimated daily energy use is about ${fmtInt(e.tdee)} kcal (Mifflin-St Jeor equation × activity ${e.mult}), minus roughly 500 kcal, and never below ${fmtInt(e.floor)} kcal. Real needs can differ by 10–20%, so adjust after 2–3 weeks of weigh-ins.` : "Enter your age to get a suggested calorie target, or type your own.";
  const td = $("#ob-tdate")?.value, tw = num($("#ob-target")?.value);
  if (isDateKey(td) && kg && tw) h += " " + paceText(kg, tw, todayKey(), td);
  return h;
}
function paceText(fromKg, toKg, fromDate, toDate) {
  const wks = (dayNum(toDate) - dayNum(fromDate)) / 7; if (wks <= 0) return "<br><b>The target date must be after the start date.</b>";
  const rate = (fromKg - toKg) / wks;
  if (rate <= 0) return "";
  const pct = rate / fromKg * 100;
  const sensible = keyFromNum(dayNum(fromDate) + Math.round((fromKg - toKg) / 0.75 * 7));
  if (rate > 1 || pct > 1) return `<br><b>This date needs about ${rate.toFixed(2)} kg per week,</b> which is faster than the 0.5–1 kg per week commonly recommended for sustainable loss. A date around ${fmtDate(sensible, { year: "numeric" })} (≈0.75 kg/week) is more realistic.`;
  return `<br>This date needs about ${rate.toFixed(2)} kg per week, within the commonly recommended 0.5–1 kg per week.`;
}
function reminderBanners() {
  const R = state.settings.reminders; if (!R.enabled || demo || !state.profile.confirmed) return "";
  const now = nowTimeIST(), t = todayKey(), out = [];
  if (now >= R.weighTime && !state.weights.some(w => w.date === t)) out.push(["No weigh-in recorded today.", "add-weight", "Add weight"]);
  if (now >= R.mealTime && !(state.food[t] || []).length) out.push(["No meals logged today.", "add-meal", "Log a meal"]);
  const p = plannedFor(t); if (!p.rest && now >= R.workoutTime && !(state.workouts[t] || {}).status) out.push([`Today's workout (${p.label}) isn't logged yet.`, "add-workout", "Log workout"]);
  return out.map(([m, a, l]) => `<div class="note warn row between"><span><b>Reminder:</b> ${esc(m)}</span><button class="btn sm" data-act="${a}">${l}</button></div>`).join("");
}

function saveWeight(editId) {
  const date = $("#w-date").value, kg = num($("#w-kg").value), note = $("#w-note").value.trim();
  const o = ui.wOpts || (ui.wOpts = {});
  const chk = checkWeight(date, kg, editId);
  const warnEl = $("#w-warn");
  if (chk.error) { warnEl.innerHTML = `<div class="note bad">${esc(chk.error)}</div>`; return; }
  if (chk.warn && chk.warn.type === "lbs" && !o.keepUnit) { warnEl.innerHTML = `<div class="note warn stack"><span>${esc(chk.warn.msg)}</span><div class="row"><button class="btn sm primary" data-act="w-lbs" data-kg="${chk.warn.kg}">Use ${chk.warn.kg} kg</button><button class="btn sm" data-act="w-opt" data-k="keepUnit">It's kg — keep ${kg}</button></div></div>`; return; }
  if (chk.warn && chk.warn.type === "big" && !o.big) { warnEl.innerHTML = `<div class="note warn stack"><span>${esc(chk.warn.msg)}</span><div class="row"><button class="btn sm primary" data-act="w-opt" data-k="big">It's correct, save</button></div></div>`; return; }
  const same = state.weights.filter(w => w.date === date && w.id !== editId);
  if (same.length && !o.dup) {
    warnEl.innerHTML = `<div class="note warn stack"><span>You already have ${same.map(w => fmtKg(w.kg) + " kg").join(", ")} on ${fmtDate(date)}.</span><div class="row"><button class="btn sm primary" data-act="w-opt" data-k="dup" data-v="replace">Replace it</button><button class="btn sm" data-act="w-opt" data-k="dup" data-v="keep">Keep both (averaged)</button></div></div>`; return;
  }
  if (o.dup === "replace") state.weights = state.weights.filter(w => !(w.date === date && w.id !== editId));
  if (editId) Object.assign(state.weights.find(w => w.id === editId), { date, kg: r1(kg * 10) / 10, note });
  else state.weights.push({ id: uid(), date, kg: Math.round(kg * 100) / 100, note, t: Date.now() });
  touch("weights");
  closeSheet(); toast(editId ? "Weigh-in updated" : `Saved ${fmtKg(kg)} kg`); render();
}

let toastT;

/* ============ export / backup ============ */
const csvCell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const csv = rows => rows.map(r => r.map(csvCell).join(",")).join("\n");
function buildExport(k) {
  const s = state;
  if (k === "weights") return ["fittrack-weights.csv", csv([["date_ist", "weight_kg", "note"], ...sortedWeights().map(w => [w.date, w.kg, w.note])])];
  if (k === "food") {
    const rows = [["date_ist", "meal", "food", "quantity", "unit", "grams", "kcal", "protein_g", "carbs_g", "fat_g", "raw_or_cooked", "manually_corrected", "day_marked_complete", "source"]];
    for (const d of Object.keys(s.food).sort()) for (const e of s.food[d]) rows.push([d, e.meal, e.name, e.qty, e.unit, e.grams ?? "", e.kcal, e.p, e.c, e.f, e.state, e.manual ? "yes" : "no", (s.dayMeta[d] || {}).complete ? "yes" : "no", e.src]);
    return ["fittrack-food.csv", csv(rows)];
  }
  if (k === "workouts") {
    const rows = [["date_ist", "planned", "status", "type", "exercise_or_activity", "set", "reps", "kg", "minutes", "notes"]];
    for (const d of Object.keys(s.workouts).sort()) {
      const l = s.workouts[d];
      if (!l.exercises.length && !l.cardio.length) rows.push([d, l.label, l.status, "", "", "", "", "", "", l.notes]);
      for (const ex of l.exercises) ex.sets.forEach((st, i) => rows.push([d, l.label, l.status, "strength", ex.name, i + 1, st.reps, st.kg, "", i === 0 ? l.notes : ""]));
      for (const c of l.cardio) rows.push([d, l.label, l.status, "cardio", c.type, "", "", "", c.min, ""]);
    }
    return ["fittrack-workouts.csv", csv(rows)];
  }
  return [`fittrack-backup-${todayKey()}.json`, JSON.stringify({ app: "FitTrack", version: 1, exportedAt: new Date().toISOString(), data: s }, null, 1)];
}
async function doExport(k) {
  const [name, data] = buildExport(k);
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { }
  if (dl) {
    try { await dl.save({ filename: name, data }); toast("Saved " + name); return; }
    catch (e) { if (e && e.code === "declined") return; }
  }
  try { // plain browser fallback (works when the file is opened directly)
    if (!window.claude) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/plain" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return; }
  } catch (e) { }
  openSheet(name, `<div class="stack"><p class="small">Downloads aren't available here. Copy the text below and save it as <b>${esc(name)}</b>.</p><textarea class="inp" id="exp-text" style="min-height:240px;font-family:ui-monospace,monospace;font-size:.8rem" readonly>${esc(data)}</textarea><div class="row"><button class="btn primary" data-act="copy-exp">Copy</button></div></div>`);
}
function restoreFrom(text) {
  const msg = $("#restore-msg");
  let obj; try { obj = JSON.parse(text); } catch (e) { msg.innerHTML = '<div class="note bad small">That file isn\'t valid JSON.</div>'; return; }
  const d = obj && obj.app === "FitTrack" ? obj.data : null;
  if (!d || !d.profile || !Array.isArray(d.weights)) { msg.innerHTML = '<div class="note bad small">That doesn\'t look like a FitTrack backup.</div>'; return; }
  ui.pendingRestore = d;
  msg.innerHTML = `<div class="note warn stack small"><span>Backup contains ${plural(d.weights.length, "weigh-in")}, ${Object.keys(d.food || {}).length} food days and ${Object.keys(d.workouts || {}).length} workout days. Restoring replaces everything currently saved.</span><div class="row"><button class="btn sm danger" data-act="restore-go">Replace my data with this backup</button></div></div>`;
}

function readProfileForm() {
  const P = { ...state.profile };
  const h = num($("#p-height").value), sw = num($("#p-start").value), tw = num($("#p-target").value), age = num($("#p-age").value), cal = num($("#p-cal").value), prot = num($("#p-prot").value);
  const errs = [];
  if (h != null && h < 3 && h > 1) errs.push(`Height looks like metres. Use ${Math.round(h * 1000) / 10} cm.`);
  else if (h == null || h < 120 || h > 230) errs.push("Height must be between 120 and 230 cm.");
  if (sw == null || sw < 30 || sw > 300) errs.push("Starting weight must be between 30 and 300 kg.");
  if (tw == null || tw < 30 || tw > 300) errs.push("Target weight must be between 30 and 300 kg.");
  if (age != null && (age < 14 || age > 100)) errs.push("Age must be between 14 and 100.");
  if (cal != null && (cal < 800 || cal > 6000)) errs.push("Calorie target must be between 800 and 6000 kcal.");

    const fd = findFood(fs.sel), qty = num($("#fs-qty").value), uv = $("#fs-unit").value;
    if (!qty || qty <= 0) return;
    const n = nutrFor(fd, qty, uv); if (n.grams > 5000) return;
    (state.food[fs.date] ||= []).push({ id: uid(), foodId: fd.id, name: fd.name, meal: fs.meal, qty, unitV: uv, ...n, state: fd.state, src: fd.src || "Your entry", manual: false });
    touch(docKeyFood(fs.date)); const d = fs.date, m = fs.meal; closeSheet(); toast(`Added ${fd.name} to ${MEALS[m]}`); ui.nDate = d; render();
  },
  "fs-addmeal": el => {
    const ml = state.foodLib.meals.find(m => m.id === el.dataset.id); if (!ml) return;
    (state.food[fs.date] ||= []).push(...ml.items.map(i => ({ ...clone(i), id: uid(), meal: fs.meal })));
    touch(docKeyFood(fs.date)); const d = fs.date; closeSheet(); toast(`Added “${ml.name}”`); ui.nDate = d; render();
  },
  "meal-save": el => {
    const m = el.dataset.meal;
    openSheet("Save as reusable meal", `<div class="stack"><label class="field"><span>Meal name</span><input id="ml-name" value="My ${MEALS[m].toLowerCase()}"></label><div class="row"><button class="btn primary" data-act="ml-save" data-meal="${m}">Save meal</button><button class="btn" data-act="close-sheet">Cancel</button></div></div>`);
  },
  "ml-save": el => {
    const name = $("#ml-name").value.trim() || "My meal";
    const items = (state.food[ui.nDate] || []).filter(x => x.meal === el.dataset.meal).map(x => { const c = clone(x); delete c.id; return c; });
    state.foodLib.meals.push({ id: "m-" + uid(), name, items }); touch("core"); closeSheet(); toast("Meal saved"); render();
  },
  "meal-del": el => { state.foodLib.meals = state.foodLib.meals.filter(m => m.id !== el.dataset.id); ui.confirmDel = null; touch("core"); render(); },
  "edit-entry": el => entrySheet(el.dataset.id),
  "entry-save": el => {
    const d = ui.nDate, x = state.food[d].find(e => e.id === el.dataset.id); const fd = x.foodId ? findFood(x.foodId) : null;
    const man = $("#e-manual").checked; x.meal = $("#e-meal").value;
    if (fd) { const qty = num($("#e-qty").value); if (!qty || qty <= 0) { $("#e-err").innerHTML = '<div class="note bad small">Enter a quantity above zero.</div>'; return; } x.qty = qty; x.unitV = $("#e-unit").value; const n = nutrFor(fd, qty, x.unitV); x.unit = n.unit; x.grams = n.grams; if (!man) Object.assign(x, { kcal: n.kcal, p: n.p, c: n.c, f: n.f }); }
    if (man) { const v = ["e-kcal", "e-p", "e-c", "e-f"].map(i => num($("#" + i).value)); if (v.some(z => z == null || z < 0)) { $("#e-err").innerHTML = '<div class="note bad small">Nutrition values must be numbers of zero or more.</div>'; return; } Object.assign(x, { kcal: Math.round(v[0]), p: v[1], c: v[2], f: v[3] }); }
    x.manual = man; touch(docKeyFood(d)); closeSheet(); toast("Entry updated"); render();
  },
  "entry-del": el => { const d = ui.nDate; state.food[d] = state.food[d].filter(e => e.id !== el.dataset.id); touch(docKeyFood(d)); closeSheet(); toast("Entry removed"); render(); },
  "custom-food": el => { const back = fs ? { ...fs } : null; customFoodSheet(el.dataset.id); ui.cfReturn = back; },
  "cf-save": el => {
    const id = el.dataset.id, name = $("#cf-name").value.trim(), basis = $("#cf-basis").value;
    const v = ["cf-kcal", "cf-p", "cf-c", "cf-f"].map(i => num($("#" + i).value) ?? (i === "cf-kcal" ? null : 0));
    const err = !name ? "Give the food a name." : v[0] == null || v.some(x => x < 0) ? "Enter calories (and any macros) as numbers of zero or more." : null;
    if (err) { $("#cf-err").innerHTML = `<div class="note bad small">${err}</div>`; return; }
    const sg = num($("#cf-sg").value), slabel = $("#cf-slabel").value.trim() || "serving";
    const nutr = { kcal: v[0], p: v[1], c: v[2], f: v[3] };
    let food = { id: id || "c-" + uid(), name, state: $("#cf-state").value, src: $("#cf-src").value.trim() || "Your entry", note: "", portions: [], basis };
    if (basis === "100g") food.per = nutr;
    else if (sg && sg > 0) { food.per = scaleNutr(nutr, 100 / sg); food.per.kcal = Math.round(nutr.kcal * 100 / sg); food.portions = [{ label: `${slabel} (${sg} g)`, g: sg }]; }
    else { food.per = nutr; food.servingOnly = true; food.servingLabel = slabel; }
    const i = state.foodLib.custom.findIndex(c => c.id === food.id);
    if (i >= 0) state.foodLib.custom[i] = food; else state.foodLib.custom.unshift(food);
    touch("core"); toast("Food saved");
    if (ui.cfReturn) { const r = ui.cfReturn; ui.cfReturn = null; foodSheet(r.date, r.meal); fs.sel = food.id; renderFoodSheet(); } else { closeSheet(); render(); }
  },
  "cf-del": el => { state.foodLib.custom = state.foodLib.custom.filter(c => c.id !== el.dataset.id); ui.confirmDel = null; touch("core"); render(); },
  "wk-status": el => { const l = getLog(ui.wkDate, true); l.status = l.status === el.dataset.v ? "" : el.dataset.v; touch(docKeyWk(ui.wkDate)); render(); },
  "ex-load": () => { const l = getLog(ui.wkDate, true); for (const n of plannedFor(ui.wkDate).exercises) if (!l.exercises.some(e => sameEx(e.name, n))) l.exercises.push(newEx(n, ui.wkDate)); touch(docKeyWk(ui.wkDate)); render(); },
  "ex-add": () => { const n = $("#ex-new").value.trim(); if (!n) { $("#ex-new").focus(); return; } const l = getLog(ui.wkDate, true); l.exercises.push(newEx(n, ui.wkDate)); touch(docKeyWk(ui.wkDate)); render(); },
  "ex-del": el => { const l = getLog(ui.wkDate); l.exercises = l.exercises.filter(e => e.id !== el.dataset.id); touch(docKeyWk(ui.wkDate)); render(); },
  "set-add": el => { const ex = getLog(ui.wkDate).exercises.find(e => e.id === el.dataset.ex); const last = ex.sets[ex.sets.length - 1]; ex.sets.push(last ? { ...last } : { reps: null, kg: null }); touch(docKeyWk(ui.wkDate)); render(); },
  "set-del": el => { const ex = getLog(ui.wkDate).exercises.find(e => e.id === el.dataset.ex); ex.sets.splice(+el.dataset.i, 1); touch(docKeyWk(ui.wkDate)); render(); },
  "cardio-add": () => { const l = getLog(ui.wkDate, true); l.cardio.push({ id: uid(), type: "Treadmill walk", min: 20 }); touch(docKeyWk(ui.wkDate)); render(); },
  "cardio-del": el => { const l = getLog(ui.wkDate); l.cardio = l.cardio.filter(c => c.id !== el.dataset.id); touch(docKeyWk(ui.wkDate)); render(); },
  resched: () => reschedSheet(),
  "rs-save": () => {
    const from = ui.wkDate, to = $("#rs-date").value; if (!isDateKey(to) || to === from) return;
    const p = plannedFor(from);
    state.overrides[to] = { label: p.label, rest: false, exercises: p.exercises, movedFrom: from };
    state.overrides[from] = { label: "Rest (workout moved)", rest: true, exercises: [], movedTo: to };
    touch("core"); closeSheet(); ui.wkDate = to; toast(`Moved to ${fmtDay(to)}`); render();
  },
  "make-rest": () => { state.overrides[ui.wkDate] = { label: "Rest day", rest: true, exercises: [] }; touch("core"); render(); },
  "reset-plan": () => { delete state.overrides[ui.wkDate]; touch("core"); render(); },
  "sch-save": () => {
    for (const k of WEEK_ORDER) state.schedule[k] = { label: $("#sch-label-" + k).value.trim() || (($("#sch-rest-" + k).checked) ? "Rest" : "Workout"), rest: $("#sch-rest-" + k).checked, exercises: $("#sch-ex-" + k).value.split(/\n|,/).map(s => s.trim()).filter(Boolean) };
    touch("core"); toast("Schedule saved"); render();
  },
  "sch-reset": () => { state.schedule = clone(DEFAULT_SCHEDULE); touch("core"); toast("Starting schedule restored"); render(); },
  "set-target": el => { $("#p-target").value = el.dataset.v; $$("[data-act=set-target]").forEach(b => b.setAttribute("aria-pressed", b === el)); },
  "use-sugg": el => { $("#p-cal").value = el.dataset.v; },
  "use-prot": el => { $("#p-prot").value = el.dataset.v; },
  "p-save": () => {
    const r = readProfileForm();
    if (r.errs) { $("#p-err").innerHTML = `<div class="note bad small">${r.errs.map(esc).join("<br>")}</div>`; return; }
    state.profile = r.P; state.profile.confirmed = true; touch("core"); toast("Profile saved"); render();
  },
  theme: el => { state.settings.theme = el.dataset.v; applyTheme(); touch("core"); render(); },
  "r-save": () => { Object.assign(state.settings.reminders, { enabled: $("#r-on").checked, weighTime: $("#r-weigh").value || "07:30", mealTime: $("#r-meal").value || "21:00", workoutTime: $("#r-wk").value || "19:00" }); touch("core"); toast("Reminders saved"); },
  export: el => doExport(el.dataset.k),
  "copy-exp": () => { const t = $("#exp-text"); const ok = () => toast("Copied"); try { navigator.clipboard.writeText(t.value).then(ok, () => { t.select(); }); } catch (e) { t.select(); } },
  "restore-go": () => {
    const d = ui.pendingRestore; if (!d || demo) return;
    const old = allDocKeys();
    state = { ...defaultState(), ...d, profile: { ...defaultState().profile, ...d.profile } };
    ui.pendingRestore = null; touch(...new Set([...old, ...allDocKeys()])); toast("Backup restored"); render();
  },
  "delete-all": async () => {
    if ($("#del-confirm").value.trim() !== "DELETE") { $("#del-confirm").focus(); toast("Type DELETE to confirm"); return; }
    const keys = allDocKeys();
    if (cloud) { try { const snap = await cloud.col.get(); for (const d of snap.docs) await cloud.col.doc(d.id).delete(); for (const k of keys) await cloud.col.doc(k).delete(); } catch (e) { toast("Couldn't reach cloud storage; try again"); return; } }
    if (sheets && !cloud) { try { await sheetsCall("deleteAll"); } catch (e) { toast("Couldn't reach your Google Sheet; nothing was deleted"); return; } sheets = null; }
    try { for (const k of Object.keys(localStorage)) if (k.startsWith("ft:")) localStorage.removeItem(k); } catch (e) { }
    for (const k of Object.keys(stamps)) delete stamps[k]; dirty.clear(); setSync(storageOK ? "local" : "memory");
    state = defaultState(); ui.tab = "dashboard"; applyTheme(); toast("All FitTrack data deleted"); render();
  },
  "sh-connect": async () => {
    const url = $("#sh-url").value.trim(), key = $("#sh-key").value.trim(), msg = $("#sh-msg");
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) { msg.innerHTML = '<div class="note bad small">Paste the web app URL from Apps Script. It starts with https://script.google.com/macros/s/ and ends with /exec.</div>'; return; }
    if (key.length < 16) { msg.innerHTML = '<div class="note bad small">Paste the secret key shown in the Apps Script log after running setup.</div>'; return; }
    const cfg = { url, key };
    msg.innerHTML = '<div class="note small">Connecting to your Google Sheet…</div>';
    let r;
    try { await sheetsCall("ping", {}, cfg); r = await sheetsCall("pull", {}, cfg); }
    catch (e) {
      const why = e && e.code === "bad_key" ? "The secret key doesn't match. Copy it again from the Apps Script log." : e && e.code === "not_set_up" ? "Run the setup function in Apps Script first." : "Couldn't reach the Sheet. Check the URL, and that the deployment's \"Who has access\" is set to Anyone.";
      msg.innerHTML = `<div class="note bad small">${esc(why)}</div>`; return;
    }
    ui.shPending = { cfg, docs: r.docs || {} };
    const remoteHas = Object.keys(ui.shPending.docs).length > 0;
    const localHas = state.profile.confirmed || state.weights.length || Object.keys(state.food).length || Object.keys(state.workouts).length;
    if (remoteHas && localHas) {
      msg.innerHTML = `<div class="note warn stack small"><span>Both this device and your Sheet already have FitTrack data. Which should this device use?</span><div class="row"><button class="btn sm primary" data-act="sh-finish" data-mode="remote">Use the Sheet's data here</button><button class="btn sm" data-act="sh-finish" data-mode="merge">Combine (newest changes win)</button></div><span class="tiny muted">"Use the Sheet's data" replaces what's on this device. "Combine" keeps whichever copy was changed most recently for each month of records.</span></div>`;
      return;
    }
    finishSheets(remoteHas ? "remote" : "merge");
  },
  "sh-finish": el => finishSheets(el.dataset.mode),
  "sh-sync": () => { sheetsPull(); },
  "sh-off": () => {
    sheets = null; try { localStorage.removeItem("ft:sheets"); } catch (e) { }
    setSync(storageOK ? "local" : "memory"); toast("Disconnected. Data stays on this device and in your Sheet."); render();
  },
};
function finishSheets(mode) {
  const p = ui.shPending; if (!p || demo) return;
  ui.shPending = null;
  sheets = p.cfg; try { localStorage.setItem("ft:sheets", JSON.stringify(sheets)); } catch (e) { }
  if (mode === "remote") {
    for (const k of Object.keys(stamps)) { delete stamps[k]; try { localStorage.removeItem("ft:doc:" + k); } catch (e) { } }
    dirty.clear(); state = defaultState();
  }
  mergeRemote(p.docs, true);
  for (const k of allDocKeys()) if (!(k in p.docs) && stamps[k]) dirty.add(k);
  lastPull = Date.now(); setSync("sheets"); flushCloud();
  toast("Connected to your Google Sheet"); render();
}
function sheetsSection() {
  if (sheets) return `<section class="card stack"><h2>Google Sheets sync</h2>
    <p class="small"><span class="pill good">Connected</span> Changes save to your Google Sheet a moment after you make them, and FitTrack loads newer data from it each time you open the app.</p>
    <p class="tiny muted" style="overflow-wrap:anywhere">${esc(sheets.url.replace(/\/macros\/s\/(.{6}).*\/exec$/, "/macros/s/$1…/exec"))}</p>
    <div class="row"><button class="btn sm" data-act="sh-sync" ${demo ? "disabled" : ""}>Sync now</button><button class="btn sm ghost" data-act="sh-off">Disconnect this device</button></div>
  </section>`;
  return `<section class="card stack"><h2>Google Sheets sync</h2>
    <p class="small">Save your entries to a Google Sheet in your own Drive so your phone and computer share the same data. Set up the Sheet's script first (see the FitTrack setup guide), then paste its details here.</p>
    <label class="field"><span>Web app URL</span><input id="sh-url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="field"><span>Secret key</span><input id="sh-key" type="password" autocomplete="off" placeholder="From the Apps Script log"></label>
    <div id="sh-msg"></div>
    <div class="row"><button class="btn primary" data-act="sh-connect" ${demo ? "disabled" : ""}>Connect</button></div>
    <p class="tiny muted">The URL and key are stored only in this browser, never in the app's code on GitHub.</p>
  </section>`;
}
function newEx(name, date) {
  const prev = exerciseHistory(name, date).pop();
  return { id: uid(), name, sets: prev ? prev.sets.map(s => ({ reps: s.reps, kg: s.kg })) : [{ reps: null, kg: null }] };
}
const LIVE = {
  ob: () => { const el = $("#ob-sugg"); el.className = "note small"; el.innerHTML = obSuggestionText(); $$("[data-act=ob-target]").forEach(b => b.setAttribute("aria-pressed", String(num($("#ob-target").value) === +b.dataset.v))); },
  wform: () => { ui.wOpts = {}; $("#w-warn").innerHTML = ""; },
  fsq: el => renderFoodList(el.value),
  fscalc: () => calcFoodSheet(),
  ecalc: () => ecalc(),
  cfb: el => { $("#cf-serv").hidden = el.value !== "serving"; },
  "n-date": el => { if (isDateKey(el.value) && el.value <= todayKey()) { ui.nDate = el.value; render(); } },
  "wk-date": el => { if (isDateKey(el.value)) { ui.wkDate = el.value; render(); } },
  expick: el => { ui.exName = el.value; render(); },
  set: el => { const ex = getLog(ui.wkDate).exercises.find(e => e.id === el.dataset.ex); const v = num(el.value); ex.sets[+el.dataset.i][el.dataset.f] = v == null ? null : el.dataset.f === "reps" ? Math.max(0, Math.round(v)) : Math.max(0, v); touch(docKeyWk(ui.wkDate)); },
  cardio: el => { const c = getLog(ui.wkDate).cardio.find(x => x.id === el.dataset.id); c[el.dataset.f] = el.dataset.f === "min" ? num(el.value) : el.value; touch(docKeyWk(ui.wkDate)); },
  wkmeta: () => { const l = getLog(ui.wkDate, true); l.notes = $("#wk-notes").value; const b = num($("#wk-burn").value); l.burnKcal = b && b > 0 ? Math.round(b) : null; touch(docKeyWk(ui.wkDate)); },
};
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.tagName === "A") e.preventDefault();
  const fn = ACT[a.dataset.act]; if (fn) fn(a, e);
});
document.addEventListener("input", e => { const el = e.target.closest("[data-live]"); if (el && LIVE[el.dataset.live] && !["n-date", "wk-date", "expick"].includes(el.dataset.live)) LIVE[el.dataset.live](el, e); });
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && ["n-date", "wk-date", "expick"].includes(el.dataset.live)) LIVE[el.dataset.live](el, e);
  if (el.dataset && el.dataset.live === "set") render(); // refresh PR badges once a set is committed
  if (el.id === "restore-file" && el.files && el.files[0]) { const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.readAsText(el.files[0]); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheetroot").innerHTML) closeSheet();
  if (e.key === "Enter" && e.target.id === "w-kg") saveWeight($("[data-act=w-save]").dataset.id || null);
  if (e.key === "Enter" && e.target.id === "fs-qty") ACT["fs-add"]();
  if (e.key === "Enter" && e.target.id === "ex-new") ACT["ex-add"]();
});

/* ============ theme + boot ============ */
const hostTheme = document.documentElement.getAttribute("data-theme");
function applyTheme() {
  const t = state.settings.theme;
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else if (hostTheme) document.documentElement.setAttribute("data-theme", hostTheme);
  else document.documentElement.removeAttribute("data-theme");
}
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render()); } catch (e) { }
loadLocal();
applyTheme();
setSync(storageOK ? "local" : "memory");
render();
initCloud();
if (ui.tab === "dashboard" && ui.nDate !== todayKey()) ui.nDate = todayKey();
</script>
</body>
